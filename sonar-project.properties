# --------------------------------------------------------------------------
# Analisis de calidad con SonarQube / SonarCloud.
#
# Uso local (Docker) :  powershell -File scripts\sonar.ps1
#                       -> servidor en http://localhost:9000
# Uso en la nube     :  .github/workflows/ci.yml (SonarCloud) -> sonarcloud.io
#
# El host y el token NO se escriben aqui: llegan por variable de entorno
# (SONAR_HOST_URL / SONAR_TOKEN) o por los parametros de scripts\sonar.ps1.
# --------------------------------------------------------------------------

sonar.projectKey=usercardjoke1036991-star_IA-COLABORATIVA
sonar.organization=usercardjoke1036991-star
sonar.projectName=IA COLABORATIVA - Arquitecto Externo
sonar.projectVersion=1.0.0

sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# Cobertura y resultados de pytest (los genera el propio script / el CI).
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPaths=pytest-report.xml

# Fuera del analisis:
#   venv/ .venv/        -> entorno virtual (miles de dependencias)
#   datos/ proyectos/   -> estado local y proyectos que genera la fabrica
#   plantillas.py       -> contiene plantillas de texto, no codigo real del MCP
#   IA COLABORATIVA.py  -> volcado de la idea original (texto, no es Python)
sonar.exclusions=venv/**,.venv/**,datos/**,proyectos/**,__pycache__/**,.scannerwork/**,coverage.xml,pytest-report.xml,plantillas.py,IA COLABORATIVA.py,**/*.md
sonar.coverage.exclusions=tests/**,scripts/**,prueba_loop.py,plantillas.py
sonar.cpd.exclusions=scripts/verificar_*.py,plantillas.py

# El informe detallado del scanner ayuda a depurar en local.
sonar.verbose=false
