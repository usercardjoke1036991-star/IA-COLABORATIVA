name: CI

# Que hace:
#   1. pruebas      -> pytest (con cobertura) en Linux y Windows + verificadores del MCP.
#   2. calidad      -> analisis en SonarQube Cloud (solo si existe el secreto SONAR_TOKEN).
#
# Secretos necesarios para el paso de calidad (Settings -> Secrets -> Actions):
#   SONAR_TOKEN     token de analisis de https://sonarcloud.io
#   SONAR_HOST_URL  (opcional) URL de un SonarQube Server propio; si falta, se usa SonarCloud.
#
# OJO: este repositorio ya tiene activado el analisis automatico de SonarQube Cloud
# (la app de SonarSource analiza cada push y publica el quality gate como check).
# Mientras siga activo, NO definas SONAR_TOKEN: el analisis manual del CI falla con
# "You are running manual analysis while Automatic Analysis is enabled".
# Para usar sonar-scanner en el CI, desactiva antes el analisis automatico en
# sonarcloud.io (Administration -> Analysis Method) y luego anade el secreto.
#
# Cadena de suministro (reglas githubactions:S7637, :S8541 y :S8544):
#   * las actions van fijadas al SHA del commit, no a un tag movil;
#   * pip instala solo wheels (--only-binary :all:), sin ejecutar setup.py;
#   * las dependencias salen de requirements.lock.txt, pinneado con == y con el
#     sha256 de cada wheel (--require-hashes): si el indice devolviera otra cosa,
#     la instalacion falla en vez de ejecutar codigo no verificado.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Instalar dependencias (lock verificado)
        run: |
          python -m pip install --upgrade --only-binary :all: "pip==26.1.2"
          python -m pip install --only-binary :all: --require-hashes -r requirements.lock.txt

      - name: Identidad de git para la fabrica
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: pytest con cobertura
        run: python -m pytest -q --cov --cov-report=xml --cov-report=term-missing --junitxml=pytest-report.xml

      - name: Verificadores del servidor MCP, de la fabrica y del activador
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # OJO: los verificadores escriben sus logs en stderr (es a proposito). Con
          # $ErrorActionPreference = 'Stop' (lo que pone GitHub Actions por defecto)
          # pwsh toma esa salida por un error terminante y aborta el paso; por eso lo
          # bajamos a 'Continue' y comprobamos el codigo de salida a mano.
          $ErrorActionPreference = 'Continue'
          $scripts = @(
            @{ ruta = 'scripts/verificar_servidor.py'; args = @() },
            # --venv: crea de verdad el venv/ del proyecto temporal. Sigue sin salir
            # a Internet (instalar es opt-in), asi que el paso no depende de la red.
            @{ ruta = 'scripts/verificar_fabrica.py'; args = @('--venv') },
            # El activador se prueba con registro aislado: el runner no ensucia
            # ningun registro y, al estar en un temporal, mide la idempotencia real.
            @{ ruta = 'scripts/verificar_activador.py'; args = @('--registro-aislado') }
          )
          foreach ($item in $scripts) {
            $llamada = @($item.ruta) + @($item.args)
            $texto = (python @llamada 2>&1 | Out-String)
            $codigo = $LASTEXITCODE
            Write-Output "--- $($item.ruta) (codigo de salida: $codigo) ---"
            Write-Output $texto
            if ($codigo -ne 0) {
              $pista = (($texto -split "`n") | Where-Object { $_ -match '\[FALLO\]|Traceback|Error|Exception' } | Select-Object -Last 5) -join ' // '
              if (-not $pista) { $pista = (($texto -split "`n") | Select-Object -Last 6) -join ' // ' }
              Write-Output "::error title=$($item.ruta)::codigo de salida $codigo -> $pista"
              exit $codigo
            }
          }

      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: informes-${{ matrix.os }}
          path: |
            coverage.xml
            pytest-report.xml
          if-no-files-found: ignore

  calidad:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: pruebas
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Instalar dependencias (lock verificado)
        run: |
          python -m pip install --upgrade --only-binary :all: "pip==26.1.2"
          python -m pip install --only-binary :all: --require-hashes -r requirements.lock.txt

      - name: Identidad de git para la fabrica
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cobertura para el analisis
        run: python -m pytest -q --cov --cov-report=xml:coverage.xml --junitxml=pytest-report.xml

      - name: Analizar (se omite si no hay SONAR_TOKEN)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Recordatorio si falta el token
        if: env.SONAR_TOKEN == ''
        run: |
          echo "Sin SONAR_TOKEN: se omite el analisis con sonar-scanner."
          echo "Anade el secreto en Settings -> Secrets and variables -> Actions."
